name: Deploy static content to Pages

on:
  push:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: yarn

      - name: Enable Yarn
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test --watch=false --browsers=ChromeHeadless

      - name: Inject Wompi public key
        env:
          WOMPI_PUBLIC_KEY: ${{ vars.WOMPI_PUBLIC_KEY }}
        run: |
          if [ -n "$WOMPI_PUBLIC_KEY" ]; then
            [[ "$WOMPI_PUBLIC_KEY" =~ ^pub_(prod|test)_[A-Za-z0-9]+$ ]] || { echo "WOMPI_PUBLIC_KEY inválida"; exit 1; }
            sed -i -E "s#publicKey: 'pub_[a-z]+_[A-Za-z0-9]+'#publicKey: '$WOMPI_PUBLIC_KEY'#" src/environments/environment.ts
          fi
          grep -q "publicKey: 'pub_" src/environments/environment.ts

      - name: Build app
        run: yarn run build -- --base-href /portfolio/
      
      - name: Artifact upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist/portfolio/browser

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4