  <!-- Decoración sutil (opcional) -->
  

  <div class="max-w-7xl mx-auto px-6 lg:px-8 relative z-10 pb-20 sm:pb-0">

      <!-- Columna 1: Sobre mí / Branding -->
      <div>
        <div class="flex items-center gap-3 mb-2">
          <img src="images/logo.svg" alt="" aria-hidden="true" width="36" height="36" class="w-9 h-9" />
          <h3 class="text-2xl font-display font-bold bg-gradient-to-r from-brand-cyan to-brand-indigo bg-clip-text text-transparent">
            JFredDev
          </h3>
        </div>
        <p class="text-sm text-brand-muted mb-4">Sistemas que operan todos los días.</p>
        <div class="flex gap-3">
          <a href="https://github.com/JFredMC" target="_blank" rel="noopener noreferrer" class="group inline-flex items-center justify-center min-h-11 min-w-11 rounded-full" aria-label="GitHub">

            <svg aria-hidden="true" class="w-6 h-6 text-gray-300 group-hover:text-cyan-300 transition-colors" fill="currentColor" viewBox="0 0 24 24">
              <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>

          </a>

          <a href="mailto:maquiloncordoba@hotmail.com" class="group inline-flex items-center justify-center min-h-11 min-w-11 rounded-full" aria-label="Email">
            <svg aria-hidden="true" class="w-6 h-6 text-gray-300 group-hover:text-cyan-300 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>

            </svg>
          </a>
        </div>
      </div>

      <!-- Columna 2: Enlaces rápidos -->
      <nav class="text-center md:text-left" aria-label="Enlaces del pie de página">
        <ul class="flex flex-wrap justify-center md:justify-start gap-x-2 gap-y-1 text-sm">
          @for (link of links; track link.id) {
            <li>
              <a
                [href]="'#' + link.id"
                (click)="scrollTo(link.id, $event)"
                class="inline-flex items-center min-h-11 px-4 py-3 text-gray-300 underline underline-offset-4 hover:text-indigo-300 transition-colors cursor-pointer"
              >
                {{ link.label }}
              </a>
            </li>
          }
        </ul>
      </nav>

      <!-- Columna 3: Contacto / Legal -->
      <div class="text-center md:text-right">
        <p class="text-sm text-gray-300">
          © {{ date | date:'yyyy' }} Jhon Maquilon. 
          <br class="sm:hidden" />
          Turbo, Antioquia.
        </p>
      </div>
    </div>

    <!-- Botón volver arriba -->
    <button 
      (click)="toggleScroll()"
      class="footer-fab fixed bottom-4 right-4 sm:bottom-8 sm:right-8 z-40 sm:z-50 min-h-11 min-w-11 bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-full shadow-lg transition-transform duration-300 hover:scale-110 active:scale-95 focus:outline-none focus:ring-2 focus:ring-indigo-400"
      [ngClass]="{
        'bg-purple-600 hover:bg-purple-700': !isAtTop
      }"
      [attr.aria-label]="isAtTop ? 'Ir al final' : 'Volver arriba'"
    >
      <!-- Ícono flecha arriba cuando NO estamos arriba -->
      @if(!isAtTop) {
        <svg aria-hidden="true" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
        </svg>
      }
      
      <!-- Ícono flecha abajo cuando estamos arriba -->
       @if(isAtTop) {
        <svg aria-hidden="true" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/>
        </svg>
      }
    </button>
  </div>
</footer>
