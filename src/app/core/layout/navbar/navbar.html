<header class="fixed top-0 left-0 right-0 z-50 backdrop-blur-xl bg-white/75 dark:bg-gray-950/75 border-b border-gray-200/40 dark:border-gray-800/40">
  <div class="max-w-7xl mx-auto px-5 sm:px-6 lg:px-8 h-26 flex items-center justify-between">
    <!-- Logo -->
    <a
      href="#home"
      (click)="$event.preventDefault(); scrollTo('home')"
      class="flex items-center gap-3 hover:scale-105 active:scale-95 transition-transform duration-300 cursor-pointer"
      aria-label="JFredDev, ir al inicio"
    >
      <img src="images/logo.svg" alt="" aria-hidden="true" width="36" height="36" class="w-9 h-9" />
      <span class="text-2xl md:text-3xl font-display font-extrabold bg-gradient-to-r from-brand-cyan to-brand-indigo bg-clip-text text-transparent">JFredDev</span>
    </a>

    <!-- Menú desktop -->
    <nav class="hidden md:flex items-center gap-8 lg:gap-10">
      <a 
        href="#home"
        (click)="$event.preventDefault(); scrollTo('home')"
        class="relative text-base lg:text-lg font-medium text-gray-700 dark:text-gray-200 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors duration-300 group cursor-pointer"
      >
        Inicio
        <span class="absolute -bottom-1 left-0 h-0.5 bg-indigo-500 dark:bg-indigo-400 w-full scale-x-0 group-hover:scale-x-100 group-focus-visible:scale-x-100 transition-transform duration-300 ease-out origin-left"></span>
      </a>

      <a 
        href="#about"
        (click)="$event.preventDefault(); scrollTo('about')" 
        class="relative text-base lg:text-lg font-medium text-gray-700 dark:text-gray-200 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors duration-300 group cursor-pointer"
      >
        Sobre mí
        <span class="absolute -bottom-1 left-0 h-0.5 bg-indigo-500 dark:bg-indigo-400 w-full scale-x-0 group-hover:scale-x-100 group-focus-visible:scale-x-100 transition-transform duration-300 ease-out origin-left"></span>
      </a>

      <a 
        href="#experience"
        (click)="$event.preventDefault(); scrollTo('experience')" 
        class="relative text-base lg:text-lg font-medium text-gray-700 dark:text-gray-200 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors duration-300 group cursor-pointer"
      >
        Experiencia
        <span class="absolute -bottom-1 left-0 h-0.5 bg-indigo-500 dark:bg-indigo-400 w-full scale-x-0 group-hover:scale-x-100 group-focus-visible:scale-x-100 transition-transform duration-300 ease-out origin-left"></span>
      </a>

      <a 
        href="#services"
        (click)="$event.preventDefault(); scrollTo('services')" 
        class="relative text-base lg:text-lg font-medium text-gray-700 dark:text-gray-200 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors duration-300 group cursor-pointer"
      >
        Servicios
        <span class="absolute -bottom-1 left-0 h-0.5 bg-indigo-500 dark:bg-indigo-400 w-full scale-x-0 group-hover:scale-x-100 group-focus-visible:scale-x-100 transition-transform duration-300 ease-out origin-left"></span>
      </a>

      <a 
        href="#projects"
        (click)="$event.preventDefault(); scrollTo('projects')" 
        class="relative text-base lg:text-lg font-medium text-gray-700 dark:text-gray-200 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors duration-300 group cursor-pointer"
      >
        Proyectos
        <span class="absolute -bottom-1 left-0 h-0.5 bg-indigo-500 dark:bg-indigo-400 w-full scale-x-0 group-hover:scale-x-100 group-focus-visible:scale-x-100 transition-transform duration-300 ease-out origin-left"></span>
      </a>

      <a 
        href="#support"
        (click)="$event.preventDefault(); scrollTo('support')" 
        class="relative text-base lg:text-lg font-medium text-gray-700 dark:text-gray-200 hover:text-amber-700 dark:hover:text-amber-300 transition-colors duration-300 group cursor-pointer"
      >
        Apoya
        <span class="absolute -bottom-1 left-0 h-0.5 bg-amber-500 dark:bg-amber-400 w-full scale-x-0 group-hover:scale-x-100 group-focus-visible:scale-x-100 transition-transform duration-300 ease-out origin-left"></span>
      </a>

      <a 
        href="#contact"
        (click)="$event.preventDefault(); scrollTo('contact')" 
        class="relative text-base lg:text-lg font-medium text-gray-700 dark:text-gray-200 hover:text-cyan-700 dark:hover:text-cyan-300 transition-colors duration-300 group cursor-pointer"
      >
        Contacto
        <span class="absolute -bottom-1 left-0 h-0.5 bg-cyan-500 dark:bg-cyan-400 w-full scale-x-0 group-hover:scale-x-100 group-focus-visible:scale-x-100 transition-transform duration-300 ease-out origin-left"></span>
      </a>

      <!-- Theme toggle en desktop -->
      <button 
        (click)="themeService.toggleTheme()" 
        class="ml-4 p-2.5 rounded-full bg-gray-200/60 dark:bg-gray-700/50 hover:bg-gray-300/80 dark:hover:bg-gray-600/70 transition-colors duration-150 active:scale-95 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
        [attr.aria-label]="themeService.isDarkMode() ? 'Cambiar al tema claro' : 'Cambiar al tema oscuro'"
      >
        @if (themeService.isDarkMode()) {
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-6 md:w-6 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        } @else {
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-6 md:w-6 text-slate-700 dark:text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        }
      </button>
    </nav>

    <!-- Controles móviles (theme + hamburguesa) -->
    <div class="flex items-center gap-3 md:hidden">
      <!-- Theme toggle móvil -->
      <button 
        (click)="themeService.toggleTheme()" 
        class="p-2.5 rounded-full bg-gray-200/60 dark:bg-gray-700/50 hover:bg-gray-300/80 dark:hover:bg-gray-600/70 transition-colors duration-150 active:scale-95"
        [attr.aria-label]="themeService.isDarkMode() ? 'Cambiar al tema claro' : 'Cambiar al tema oscuro'"
      >
        @if (themeService.isDarkMode()) {
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        } @else {
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-700 dark:text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        }
      </button>

      <!-- Botón hamburguesa / cerrar -->
      <button 
        #menuButton
        class="p-2 rounded-lg hover:bg-gray-200/70 dark:hover:bg-gray-700/60 transition-colors duration-150 active:scale-95 focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen"
        aria-controls="mobile-navigation"
        [attr.aria-label]="isMenuOpen ? 'Cerrar menú móvil' : 'Abrir menú móvil'"
      >
        @if (!isMenuOpen) {
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-gray-800 dark:text-gray-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        } @else {
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-gray-800 dark:text-gray-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- Menú móvil desplegable -->
  <div [class.hidden]="!isMenuOpen && !isMenuClosing()" [class.animate-fade-in-down]="isMenuOpen" [class.animate-fade-out-up]="isMenuClosing()" [attr.aria-hidden]="!isMenuOpen" [attr.inert]="isMenuOpen ? null : ''" class="md:hidden absolute top-full left-0 right-0 bg-white/95 dark:bg-gray-950/95 backdrop-blur-lg border-b border-gray-200/40 dark:border-gray-800/40 shadow-xl">
      <nav id="mobile-navigation" aria-label="Navegación móvil" class="max-w-7xl mx-auto px-5 py-6">
        <ul class="flex flex-col gap-5 text-lg font-medium">
          <li>
            <a 
              href="#home"
              (click)="$event.preventDefault(); scrollTo('home'); closeMenu()"
              class="block py-3 px-4 text-gray-800 dark:text-gray-100 hover:bg-indigo-50 dark:hover:bg-indigo-950/30 rounded-xl transition-colors duration-150 cursor-pointer"
            >
              Inicio
            </a>
          </li>
          <li>
            <a 
              href="#about"
              (click)="$event.preventDefault(); scrollTo('about'); closeMenu()"
              class="block py-3 px-4 text-gray-800 dark:text-gray-100 hover:bg-indigo-50 dark:hover:bg-indigo-950/30 rounded-xl transition-colors duration-150 cursor-pointer"
            >
              Sobre mí
            </a>
          </li>
          <li>
            <a 
              href="#experience"
              (click)="$event.preventDefault(); scrollTo('experience'); closeMenu()"
              class="block py-3 px-4 text-gray-800 dark:text-gray-100 hover:bg-indigo-50 dark:hover:bg-indigo-950/30 rounded-xl transition-colors duration-150 cursor-pointer"
            >
              Experiencia
            </a>
          </li>
          <li>
            <a 
              href="#services"
              (click)="$event.preventDefault(); scrollTo('services'); closeMenu()"
              class="block py-3 px-4 text-gray-800 dark:text-gray-100 hover:bg-indigo-50 dark:hover:bg-indigo-950/30 rounded-xl transition-colors duration-150 cursor-pointer"
            >
              Servicios
            </a>
          </li>
          <li>
            <a 
              href="#projects"
              (click)="$event.preventDefault(); scrollTo('projects'); closeMenu()"
              class="block py-3 px-4 text-gray-800 dark:text-gray-100 hover:bg-indigo-50 dark:hover:bg-indigo-950/30 rounded-xl transition-colors duration-150 cursor-pointer"
            >
              Proyectos
            </a>
          </li>
          <li>
            <a 
              href="#support"
              (click)="$event.preventDefault(); scrollTo('support'); closeMenu()"
              class="block py-3 px-4 text-amber-700 dark:text-amber-300 hover:bg-amber-50 dark:hover:bg-amber-950/30 rounded-xl transition-colors duration-150 cursor-pointer"
            >
              Apoya
            </a>
          </li>
          <li>
            <a 
              href="#contact"
              (click)="$event.preventDefault(); scrollTo('contact'); closeMenu()"
              class="block py-3 px-4 text-gray-800 dark:text-gray-100 hover:bg-cyan-50 dark:hover:bg-cyan-950/30 rounded-xl transition-colors duration-150 cursor-pointer"
            >
              Contacto
            </a>
          </li>
        </ul>
      </nav>
  </div>
</header>
